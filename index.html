<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234dd8ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23d8fbff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <video id="camera" playsinline muted></video>
    <div id="tint"></div>
    <canvas id="hud"></canvas>

    <div id="controls">
      <button id="toggle-spotify" type="button" title="Conectar a conta do Spotify (Premium)">SPOTIFY</button>
      <button id="toggle-claude" type="button" title="Liga/desliga o Claude no JARVIS (tecla C). Usa a cota do seu plano.">CLAUDE: OFF</button>
      <button id="toggle-style" type="button" title="Voz do JARVIS (tecla L)">VOZ: FILME (UK)</button>
      <button id="toggle-speech" type="button" title="Liga/desliga a fala do JARVIS (tecla S)">FALA: ON</button>
      <button id="toggle-mic" type="button" title="Liga/desliga o microfone, que fica esperando a palavra Jarvis (tecla V)">MICROFONE: OFF</button>
    </div>

    <section id="terminal" hidden aria-label="Terminal de voz"></section>

    <p id="notice" hidden></p>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
